<!DOCTYPE html><html lang=en><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1.0"><title>Product cards</title><link rel=stylesheet href=layout_product-cards.f8b5442f.css><link rel=preconnect href=https://fonts.googleapis.com><link rel=preconnect href=https://fonts.gstatic.com crossorigin=anonymous><link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&amp;display=swap" rel=stylesheet><body>
    <div class=card data-qa=card>
      <img src=imac.202c52ff.jpeg alt=imac class=card__image>

      <div class=card__title>
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </div>
      <div class=card__code>Product code: 195434</div>

      <div class=card__review-block>
        <article class="stars stars--4">
          <div class=stars__star></div>
          <div class=stars__star></div>
          <div class=stars__star></div>
          <div class=stars__star></div>
          <div class=stars__star></div>
        </article>
        <div class=card__review>Reviews: 5</div>
      </div>

      <div class=card__price>
        <span class=card__price-name>Price:</span>
        <span class=card__price-cost>$2,199</span>
      </div>
      <div class=card__button-container>
        <a href=# data-qa=hover class=card__button>
          BUY
        </a>
      </div>
    </div>
